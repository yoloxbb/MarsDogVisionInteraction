[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marsdog-vision-interaction"
version = "0.1.1"
description = "Independent MarsDog camera and visual interaction ROS2 node"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "Apache-2.0"
maintainers = [
  { name = "MarsDog Vision Team", email = "noreply@marsdog.dev" },
]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<2",
  "opencv-contrib-python>=4.10,<5",
  "python-multipart>=0.0.9,<1",
  "pyyaml>=6,<7",
  "rknn-toolkit-lite2==2.3.2; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "ultralytics>=8.4.118",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
models = [
  "mediapipe==0.10.18",
  "supervision>=0.29,<0.30",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[project.scripts]
marsdog-vision-interaction = "marsdog_vision_interaction.main:main"
marsdog-camera-driver = "marsdog_vision_interaction.nodes.camera_driver_node:main"
marsdog-vision-viewer = "marsdog_vision_interaction.nodes.vision_debug_viewer_node:main"

[tool.setuptools.packages.find]
include = ["marsdog_vision_interaction*"]

[tool.setuptools.package-data]
marsdog_vision_interaction = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
